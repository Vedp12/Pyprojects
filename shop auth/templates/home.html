<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Street Bazaar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  
  <body>
    <div class="home-wrapper">
      <!-- ── Top Nav ────────────────────────────────────────── -->
      <nav class="home-nav">
        <span class="logo">Street Bazaar</span>
        <div class="nav-user">
          <span>👋 Welcome, {{ name }}</span>
          <a href="{{ url_for('logout') }}" class="btn-logout">Log Out</a>
        </div>
      </nav>

      <!-- ── Body ───────────────────────────────────────────── -->
      <div class="home-body">
        <div class="welcome-card">
          <div class="emoji">🏪</div>
          <h2>Your Shop Dashboard</h2>
          <p>
            You're logged in as <strong>{{ name }}</strong>. Start managing your
            inventory,<br />issue invoices, and grow your business from here.
          </p>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="label">Total Products</div>
            <div class="value">—</div>
          </div>
          <div class="stat-card">
            <div class="label">Invoices This Month</div>
            <div class="value">—</div>
          </div>
          <div class="stat-card">
            <div class="label">Revenue (₹)</div>
            <div class="value">—</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
